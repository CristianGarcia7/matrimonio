services:
  app:
    build:
      context: .
    image: wedding-invitation:latest
    container_name: wedding-invitation
    restart: unless-stopped
    # Runs tini as PID 1 for correct signal handling and process reaping.
    init: true
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      GUESTBOOK_DB_PATH: /app/data/guestbook.db
    volumes:
      # Persists guestbook signatures (SQLite) across container rebuilds.
      - guestbook-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  guestbook-data:
